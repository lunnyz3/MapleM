name: chatbot-python-ci

on:
  push:
    paths:
      - "chatbot_service/**"
      - ".github/workflows/chatbot-python-ci.yml"
  pull_request:
    paths:
      - "chatbot_service/**"
      - ".github/workflows/chatbot-python-ci.yml"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r chatbot_service/requirements.lock

      - name: Run tests
        run: python -m pytest chatbot_service/tests -q
