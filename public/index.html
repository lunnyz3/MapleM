    <header class="topbar">

              <a class="topbar__dropdown-item" href="/ranking.html?type=level">종합 랭킹</a>

          </div>
        </nav>
      </div>
      <div class="topbar__right">
        <form id="quickSearchForm" class="topbar-search">
          <select id="topWorldName" name="world_name" aria-label="월드명">
            <option value="스카니아" selected>스카니아</option>
            <option value="루나">루나</option>
            <option value="제니스">제니스</option>
            <option value="크로아">크로아</option>
            <option value="유니온">유니온</option>
            <option value="엘리시움">엘리시움</option>
            <option value="아케인">아케인</option>
          </select>
          <input id="topCharacterName" name="character_name" placeholder="캐릭터명" aria-label="캐릭터명" />
          <button type="submit">검색</button>
        </form>
      </div>
    </header>

    <main class="page page--index">
      <section class="index-search">
        <h2>캐릭터 조회</h2>
        <form id="searchForm" class="index-form">
          <label>
            <span>월드명</span>
            <select id="worldName" name="world_name" required>
              <option value="스카니아" selected>스카니아</option>
              <option value="루나">루나</option>
              <option value="제니스">제니스</option>
              <option value="크로아">크로아</option>
              <option value="유니온">유니온</option>
              <option value="엘리시움">엘리시움</option>
              <option value="아케인">아케인</option>
            </select>
          </label>
          <label>
            <span>캐릭터명</span>
            <input id="characterName" name="character_name" placeholder="캐릭터명을 입력하세요" required autofocus />
          </label>
          <button type="submit">조회</button>
        </form>
      </section>
    </main>

    <footer class="site-footer">
      <p>Data based on NEXON Open API · 메이플M 플러스는 넥슨의 공식 서비스가 아닙니다.</p>
    </footer>

    <script type="module" src="/js/main.js?v=20261028a"></script>
