<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MapleM 캐릭터 검색</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body data-page="index">
    <main class="page page--index">
      <section class="hero hero--search">
        <div class="hero__label">MAPLEM</div>
        <h1>캐릭터 정보를 바로 조회하세요</h1>
        <p>
          서버명과 캐릭터명을 입력하면 캐릭터 전용 페이지에서 기본정보와 장비, 하이퍼스탯,
          V매트릭스, 헥사매트릭스 등을 탭으로 확인할 수 있습니다.
        </p>
      </section>

      <section class="panel panel--search">
        <h2>캐릭터 조회</h2>
        <form id="searchForm" class="search-form">
          <label>
            <span>서버명</span>
            <select id="worldName" name="world_name" required>
              <option value="스카니아">스카니아</option>
              <option value="루나">루나</option>
              <option value="엘리시움">엘리시움</option>
              <option value="유니온" selected>유니온</option>
              <option value="제니스">제니스</option>
              <option value="아케인">아케인</option>
            </select>
          </label>
          <label>
            <span>캐릭터명</span>
            <input id="characterName" name="character_name" placeholder="캐릭터명을 입력하세요" required />
          </label>
          <button type="submit">캐릭터 페이지 열기</button>
        </form>

        <p class="route-preview" id="routePreview">/character/유니온/캐릭터명</p>
      </section>
    </main>

    <script src="/js/main.js?v=20260223j"></script>
  </body>
</html>
