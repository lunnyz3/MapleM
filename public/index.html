<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MapleM 캐릭터 조회</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body data-page="index">
    <header class="topbar">
      <div class="topbar__left">
        <a class="topbar__brand" href="/">MAPLEM</a>
        <nav class="topbar__nav" aria-label="주요 메뉴">
          <a class="topbar__menu is-active" href="/">메인</a>
          <div class="topbar__dropdown">
            <button type="button" class="topbar__menu topbar__dropdown-toggle" aria-haspopup="true">랭킹</button>
            <div class="topbar__dropdown-menu">
              <a class="topbar__dropdown-item" href="/ranking.html?type=level">종합 랭킹</a>
              <a class="topbar__dropdown-item" href="/ranking.html?type=union">유니온 랭킹</a>
              <a class="topbar__dropdown-item" href="/ranking.html?type=achievement">업적 랭킹</a>
              <a class="topbar__dropdown-item" href="/ranking.html?type=sharenian-battlefield">샤레니안의 전장 랭킹</a>
              <a class="topbar__dropdown-item" href="/ranking.html?type=sharenian-waterway">샤레니안의 지하수로 랭킹</a>
              <a class="topbar__dropdown-item" href="/ranking.html?type=root-of-time">시간의근원 랭킹</a>
            </div>
          </div>
        </nav>
      </div>
      <div class="topbar__right">
        <div class="theme-switch">
          <label for="themeMode">테마</label>
          <select id="themeMode" data-theme-select>
            <option value="system">시스템</option>
            <option value="dark">다크</option>
            <option value="light">라이트</option>
          </select>
        </div>
        <form id="quickSearchForm" class="topbar-search">
          <select id="topWorldName" name="world_name" aria-label="월드명">
            <option value="스카니아">스카니아</option>
            <option value="루나">루나</option>
            <option value="제니스">제니스</option>
            <option value="크로아">크로아</option>
            <option value="유니온" selected>유니온</option>
            <option value="엘리시움">엘리시움</option>
            <option value="아케인">아케인</option>
          </select>
          <input id="topCharacterName" name="character_name" placeholder="캐릭터명" aria-label="캐릭터명" />
          <button type="submit">검색</button>
        </form>
      </div>
    </header>

    <main class="page page--index">
      <section class="index-search">
        <h1>캐릭터 조회</h1>
        <form id="searchForm" class="index-form">
          <label>
            <span>월드명</span>
            <select id="worldName" name="world_name" required>
              <option value="스카니아">스카니아</option>
              <option value="루나">루나</option>
              <option value="제니스">제니스</option>
              <option value="크로아">크로아</option>
              <option value="유니온" selected>유니온</option>
              <option value="엘리시움">엘리시움</option>
              <option value="아케인">아케인</option>
            </select>
          </label>
          <label>
            <span>캐릭터명</span>
            <input id="characterName" name="character_name" placeholder="캐릭터명을 입력하세요" required autofocus />
          </label>
          <button type="submit">조회</button>
        </form>
      </section>
    </main>

    <script src="/js/main.js?v=20260303h"></script>
  </body>
</html>
