<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>메이플M 플러스 - maplem.co.kr</title>
    <link rel="icon" type="image/png" href="/assets/logo.png" />
    <link rel="stylesheet" href="/css/common.css?v=20260725c" />
    <link rel="stylesheet" href="/css/page-character.css?v=20260305s" />
  </head>
  <body data-page="character">
    <header class="topbar">
      <div class="topbar__left">
        <nav class="topbar__nav" aria-label="주요 메뉴">
          <a class="topbar__menu" href="/">메인</a>
          <div class="topbar__dropdown">
            <button type="button" class="topbar__menu topbar__dropdown-toggle" aria-haspopup="true">랭킹</button>
            <div class="topbar__dropdown-menu">
              <a class="topbar__dropdown-item" href="/ranking.html?type=level">종합 랭킹</a>
              <a class="topbar__dropdown-item" href="/ranking.html?type=union">유니온 랭킹</a>
              <a class="topbar__dropdown-item" href="/ranking.html?type=achievement">업적 랭킹</a>
              <a class="topbar__dropdown-item" href="/ranking.html?type=sharenian-battlefield">샤레니안의 전장 랭킹</a>
              <a class="topbar__dropdown-item" href="/ranking.html?type=sharenian-waterway">샤레니안의 지하수로 랭킹</a>
              <a class="topbar__dropdown-item" href="/ranking.html?type=root-of-time">시간의근원 랭킹</a>
            </div>
          </div>
        </nav>
      </div>
      <div class="topbar__right">
        <form id="quickSearchForm" class="topbar-search">
          <select id="topWorldName" name="world_name" aria-label="서버명">
            <option value="스카니아" selected>스카니아</option>
            <option value="루나">루나</option>
            <option value="제니스">제니스</option>
            <option value="크로아">크로아</option>
            <option value="유니온">유니온</option>
            <option value="엘리시움">엘리시움</option>
            <option value="아케인">아케인</option>
            <option value="챌린저스">챌린저스</option>
          </select>
          <input id="topCharacterName" name="character_name" placeholder="캐릭터명" aria-label="캐릭터명" />
          <button type="submit">검색</button>
        </form>
      </div>
    </header>

    <main class="page page--character">
      <section id="pageMessage" class="notice">캐릭터 데이터를 불러오는 중입니다...</section>

      <section id="profileCard" class="profile-card" hidden></section>

      <nav id="tabNav" class="tab-nav" hidden>
        <button type="button" data-tab="equipment" class="tab-btn is-active">장비</button>
        <button type="button" data-tab="exp" class="tab-btn">경험치 그래프</button>
        <button type="button" data-tab="jewelSymbolVmatrix" class="tab-btn">쥬얼·심볼</button>
        <button type="button" data-tab="hexamatrix" class="tab-btn">스킬</button>
        <button type="button" data-tab="hyperStat" class="tab-btn">하이퍼스탯·링크스킬</button>
        <button type="button" data-tab="guild" class="tab-btn">길드</button>
        <button type="button" data-tab="union" class="tab-btn">유니온</button>
      </nav>

      <section id="tabContent" class="tab-content">
        <article class="data-card data-card--wide">
          <h3>로딩 중</h3>
          <p class="empty">캐릭터 데이터를 불러오는 중입니다...</p>
        </article>
      </section>
    </main>

    <button
      id="characterChatLauncher"
      class="character-chat-launcher"
      type="button"
      aria-label="Open chatbot"
      aria-haspopup="dialog"
      aria-expanded="false"
    >
      <img src="/assets/logo.png" alt="" />
      <span class="character-chat-launcher__dot" aria-hidden="true"></span>
    </button>

    <div id="characterChatOverlay" class="character-chat-overlay" hidden></div>

    <aside id="characterChatPanel" class="character-chat-panel" hidden aria-label="AI 챗봇">
      <div class="character-chat-panel__head">
        <div class="character-chat-panel__title">
          <button
            id="characterChatHeaderToggle"
            type="button"
            class="character-chat-header-toggle"
            aria-label="Toggle chat"
          >
            <img src="/assets/logo.png" alt="" />
          </button>
          <div class="character-chat-panel__title-text">
            <h3>멤플 봇 (MapleM-bot)</h3>
            <p id="characterChatStatus" class="character-chat-status">세션 상태 확인 중...</p>
          </div>
        </div>
        <div class="character-chat-panel__actions">
          <button id="characterChatCloseBtn" type="button" class="character-chat-close-btn" aria-label="채팅 숨기기">X</button>
        </div>
      </div>
      <div id="characterChatMessages" class="character-chat-messages" role="log" aria-live="polite"></div>
      <form id="characterChatForm" class="character-chat-form">
        <textarea
          id="characterChatInput"
          name="message"
          rows="3"
          maxlength="2000"
          placeholder="메시지를 입력하세요..."
          aria-label="채팅 메시지"
        ></textarea>
        <button id="characterChatSendBtn" type="submit">전송</button>
      </form>
    </aside>

    <script type="module" src="/js/main.js?v=20260305s"></script>
  </body>
</html>
